<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="keywords" content="{{ site.keywords }}"/>
  <meta name="theme-color" content="#0f1117"/>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "@id": "{{ site.url }}/#person",
        "name": "{{ site.author.name }}",
        "jobTitle": "{{ site.author.title }}",
        "description": "{{ site.description | strip_newlines }}",
        "url": "{{ site.url }}/",
        "image": "https://github.com/{{ site.author.github }}.png",
        "email": "{{ site.author.email }}",
        "address": {"@type": "PostalAddress", "addressLocality": "Atlanta", "addressRegion": "GA", "addressCountry": "US"},
        "sameAs": [
          "https://www.linkedin.com/in/{{ site.author.linkedin }}/",
          "https://github.com/{{ site.author.github }}",
          "https://medium.com/{{ site.author.medium }}",
          "https://substack.com/{{ site.author.substack }}",
          "https://www.youtube.com/{{ site.author.youtube }}",
          "https://dev.to/{{ site.author.devto }}"
        ],
        "knowsAbout": ["Apache Airflow","Data Engineering","Generative AI","RAG","LLMs","Python","Kubernetes","dbt","Snowflake","LangChain","MLOps"],
        "worksFor": {"@type": "Organization","name": "{{ site.author.company }}"},
        "memberOf": {"@type": "Organization", "name": "Women in Data"},
        "award": ["Astronomer Champion for Apache Airflow","6x Apache Airflow Certified","AWS Certified Cloud Practitioner"],
        "makesOffer": [
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Freelance Data & AI Engineering", "serviceType": "Apache Airflow pipelines, ETL/ELT, RAG and generative AI applications", "url": "{{ site.url }}/services/"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Apache Airflow Consulting", "serviceType": "DAG reviews, pipeline audits, performance tuning and Airflow 3 migration guidance", "url": "{{ site.url }}/services/"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "1:1 Career & Technical Mentorship", "serviceType": "Mentorship in data engineering and AI", "url": "{{ site.url }}/services/"}}
        ]
      },
      {
        "@type": "WebSite",
        "@id": "{{ site.url }}/#website",
        "url": "{{ site.url }}/",
        "name": "{{ site.title }}",
        "inLanguage": "en-US",
        "publisher": {"@id": "{{ site.url }}/#person"}
      },
      {
        "@type": "ProfilePage",
        "@id": "{{ site.url }}/#profilepage",
        "url": "{{ site.url }}/",
        "name": "{{ site.title }} | {{ site.author.title }}",
        "isPartOf": {"@id": "{{ site.url }}/#website"},
        "mainEntity": {"@id": "{{ site.url }}/#person"}
      }
    ]
  }
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>

    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></symbol>

  {{ content }}
</body>
</html>
